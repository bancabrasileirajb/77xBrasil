    <style>
        /* Estilos críticos inline para performance */
        :root {
            --bg-color: #000;
            --text-color: #333;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --secondary-color: #f1f1f1;
            --secondary-hover: #e2e2e2;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        /* Melhoria de CLS: Iframe com dimensões fixas e background */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background-color: var(--bg-color);
            color-scheme: dark;
        }

        /* Pop-up PWA Otimizado */
        #pwa-prompt {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: var(--text-color);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
            z-index: 10000;
            width: 90%;
            max-width: 380px;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.1);
            will-change: transform, opacity;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        #pwa-prompt p {
            margin: 0 0 16px 0;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
        }

        .pwa-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            flex: 1;
        }

        .btn:active { transform: scale(0.98); }

        .btn-install {
            background-color: var(--primary-color);
            color: #fff;
        }

        .btn-install:hover { background-color: var(--primary-hover); }

        .btn-close {
            background-color: var(--secondary-color);
            color: #555;
        }

        .btn-close:hover { background-color: var(--secondary-hover); }

        /* Acessibilidade: Esconder H1 visualmente mas manter para SEO/Screen Readers */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body>

    <!-- SEO & Acessibilidade: Título Principal Oculto -->
    <h1 class="sr-only">77X BRASIL - Apostas Online e Jogo do Bicho</h1>

    <!-- Pop-up do PWA com ARIA labels -->
    <div id="pwa-prompt" role="dialog" aria-labelledby="pwa-title" aria-modal="true">
        <p id="pwa-title">Instale nosso App para uma experiência mais rápida e em tela cheia!</p>
        <div class="pwa-buttons">
            <button class="btn btn-close" id="pwa-close" aria-label="Fechar convite de instalação">Agora não</button>
            <button class="btn btn-install" id="pwa-install" aria-label="Instalar aplicativo 77X Brasil">Instalar App</button>
        </div>
    </div>

    <!-- Iframe Otimizado -->
    <iframe 
        src="https://app.sorteclub.com/pr/xpBkJtSK" 
        title="Plataforma de Apostas 77x Brasil"
        allow="clipboard-read; clipboard-write; camera; microphone; geolocation; display-capture; fullscreen"
        loading="eager"
        fetchpriority="high"
        allowfullscreen>
    </iframe>

    <script>
        // Otimização do Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { scope: '/' })
                    .then(reg => console.log('SW registrado com sucesso'))
                    .catch(err => console.error('Falha ao registrar SW:', err));
            });
        }

        // Lógica PWA com melhorias de UX
        let deferredPrompt;
        const pwaPrompt = document.getElementById('pwa-prompt');
        const installBtn = document.getElementById('pwa-install');
        const closeBtn = document.getElementById('pwa-close');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Pequeno delay para não interromper o carregamento inicial
            setTimeout(() => {
                pwaPrompt.style.display = 'block';
            }, 3000);
        });

        installBtn.addEventListener('click', async () => {
            pwaPrompt.style.display = 'none';
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`Usuário escolheu: ${outcome}`);
                deferredPrompt = null;
            }
        });

        closeBtn.addEventListener('click', () => {
            pwaPrompt.style.display = 'none';
            // Opcional: Salvar no localStorage para não mostrar novamente na mesma sessão
            sessionStorage.setItem('pwa-prompt-dismissed', 'true');
        });

        // Verifica se já foi dispensado nesta sessão
        if (sessionStorage.getItem('pwa-prompt-dismissed') === 'true') {
            pwaPrompt.style.display = 'none';
        }
    </script>
</body>
