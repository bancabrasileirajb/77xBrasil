    <style>
        /* Estilos críticos inline para performance máxima */
        :root {
            --bg-color: #000;
            --text-color: #333;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --secondary-color: #f1f1f1;
            --secondary-hover: #e2e2e2;
            --splash-bg: #00bb6a;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        /* SPLASH SCREEN MINIMALISTA - Apenas imagem e fundo verde */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--splash-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.6s ease-out;
        }

        #splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .splash-icon {
            width: 120px;
            height: 120px;
            animation: fadeInScale 0.8s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Container do iframe - inicialmente oculto */
        #iframe-container {
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.6s ease-out;
        }

        #iframe-container.visible {
            opacity: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background-color: var(--bg-color);
            color-scheme: dark;
        }

        /* Pop-up PWA Otimizado */
        #pwa-prompt {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: var(--text-color);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
            z-index: 10000;
            width: 90%;
            max-width: 380px;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.1);
            will-change: transform, opacity;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        #pwa-prompt p {
            margin: 0 0 16px 0;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
        }

        .pwa-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            flex: 1;
        }

        .btn:active { transform: scale(0.98); }

        .btn-install {
            background-color: var(--primary-color);
            color: #fff;
        }

        .btn-install:hover { background-color: var(--primary-hover); }

        .btn-close {

        }

        .btn-close:hover { background-color: var(--secondary-hover); }

        /* Acessibilidade */

            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;

<body>

    <!-- SEO & Acessibilidade: Título Principal Oculto -->
    <h1 class="sr-only">77X BRASIL - Apostas Online e Jogo do Bicho</h1>

    <!-- SPLASH SCREEN MINIMALISTA -->
    <div id="splash-screen">
        <img src="/Assets/favicon-512.webp" alt="77X Brasil" class="splash-icon">
    </div>

    <!-- Container do iframe com carregamento progressivo -->
    <div id="iframe-container">
        <!-- Iframe Otimizado -->
        <iframe 
            id="main-iframe"
            src="https://app.sorteclub.com/pr/xpBkJtSK" 
            title="Plataforma de Apostas 77x Brasil"
            allow="clipboard-read; clipboard-write; camera; microphone; geolocation; display-capture; fullscreen"
            loading="lazy"
            fetchpriority="low"
            allowfullscreen>
        </iframe>
    </div>

    <!-- Pop-up do PWA com ARIA labels -->
    <div id="pwa-prompt" role="dialog" aria-labelledby="pwa-title" aria-modal="true">
        <p id="pwa-title">Instale nosso App para uma experiência mais rápida e em tela cheia!</p>
        <div class="pwa-buttons">
            <button class="btn btn-close" id="pwa-close" aria-label="Fechar convite de instalação">Agora não</button>
            <button class="btn btn-install" id="pwa-install" aria-label="Instalar aplicativo 77X Brasil">Instalar App</button>
        </div>
    </div>

    <script>
        // ============================================
        // 1. GERENCIAMENTO DO SPLASH SCREEN
        // ============================================
        const splashScreen = document.getElementById('splash-screen');
        const iframeContainer = document.getElementById('iframe-container');
        const mainIframe = document.getElementById('main-iframe');

        /**
         * Esconde o splash screen com transição suave
         */
        function hideSplashScreen() {
            splashScreen.classList.add('hidden');
            iframeContainer.classList.add('visible');
        }

        /**
         * Estratégia de carregamento: Esconde splash quando:
         * 1. O iframe começar a carregar (readystatechange)
         * 2. Ou após timeout de 3s (fallback para conexões lentas)
         */
        let splashHidden = false;

        // Monitora o carregamento do iframe
        mainIframe.addEventListener('load', () => {
            if (!splashHidden) {
                splashHidden = true;
                hideSplashScreen();
            }
        });

        mainIframe.addEventListener('error', () => {
            console.error('Erro ao carregar iframe');
            if (!splashHidden) {
                splashHidden = true;
                hideSplashScreen();
            }
        });

        // Fallback: Esconde splash após 3 segundos (garante UX mesmo com conexão lenta)
        const splashTimeout = setTimeout(() => {
            if (!splashHidden) {
                splashHidden = true;
                hideSplashScreen();
            }
        }, 3000);

        // Otimização: Dispara carregamento do iframe imediatamente
        window.addEventListener('DOMContentLoaded', () => {
            // Força o início do carregamento do iframe
            mainIframe.src = mainIframe.src;
        });

        // ============================================
        // 2. SERVICE WORKER REGISTRATION
        // ============================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { scope: '/' })
                    .then(reg => console.log('SW registrado com sucesso'))
                    .catch(err => console.error('Falha ao registrar SW:', err));
            });
        }

        // ============================================
        // 3. LÓGICA PWA COM MELHORIAS DE UX
        // ============================================
        let deferredPrompt;
        const pwaPrompt = document.getElementById('pwa-prompt');
        const installBtn = document.getElementById('pwa-install');
        const closeBtn = document.getElementById('pwa-close');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Mostra prompt após 5 segundos (depois que o conteúdo está visível)
            setTimeout(() => {
                if (sessionStorage.getItem('pwa-prompt-dismissed') !== 'true') {
                    pwaPrompt.style.display = 'block';
                }
            }, 5000);
        });

        installBtn.addEventListener('click', async () => {
            pwaPrompt.style.display = 'none';
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`Usuário escolheu: ${outcome}`);
                deferredPrompt = null;
            }
        });

        closeBtn.addEventListener('click', () => {
            pwaPrompt.style.display = 'none';
            sessionStorage.setItem('pwa-prompt-dismissed', 'true');
        });

        // Verifica se já foi dispensado nesta sessão
        if (sessionStorage.getItem('pwa-prompt-dismissed') === 'true') {
            pwaPrompt.style.display = 'none';
        }

        // ============================================
        // 4. OTIMIZAÇÃO ADICIONAL: Prefetch de recursos
        // ============================================
        // Prefetch do domínio do iframe assim que possível
        if ('requestIdleCallback' in window) {
            requestIdleCallback(() => {
                const link = document.createElement('link');
                link.rel = 'prefetch';
                link.href = 'https://app.sorteclub.com/pr/xpBkJtSK';
                document.head.appendChild(link);
            });
        }
    </script>
