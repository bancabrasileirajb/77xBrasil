    <!-- ========================================== -->
    <!-- 4. ESTILOS (CSS) -->
    <!-- ========================================== -->
    <style>
        /* Reset para tela cheia absoluta */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Remove rolagem dupla */
            background-color: #000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Iframe invisível até carregar, ocupando 100% do espaço */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Pop-up Customizado de Instalação do PWA */
        #pwa-prompt {
            display: none; /* Escondido por padrão, ativado via JS */
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: #333;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 9999;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #e0e0e0;
        }

        #pwa-prompt p {
            margin: 0 0 12px 0;
            font-size: 15px;
            font-weight: 500;
        }

        .pwa-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-install {
            background-color: #007bff;
            color: white;
            flex: 1;
        }

        .btn-install:hover { background-color: #0056b3; }

        .btn-close {
            background-color: #f1f1f1;
            color: #555;
        }

        .btn-close:hover { background-color: #e2e2e2; }
    </style>
</head>
<body>

    <!-- Pop-up do PWA -->
    <div id="pwa-prompt">
        <p>Instale nosso App para uma experiência mais rápida e em tela cheia!</p>
        <div class="pwa-buttons">
            <button class="btn btn-close" id="pwa-close">Agora não</button>
            <button class="btn btn-install" id="pwa-install">Instalar App</button>
        </div>
    </div>

    <!-- Iframe com permissões completas de hardware e clipboard -->
    <iframe 
        src="https://app.sorteclub.com/pr/xpBkJtSK" 
        title="77x Brasil"
        allow="clipboard-read; clipboard-write; camera; microphone; geolocation; display-capture; fullscreen"
        allowfullscreen>
    </iframe>

    <!-- ========================================== -->
    <!-- 5. SCRIPTS (Service Worker e Lógica PWA) -->
    <!-- ========================================== -->
    <script>
        // Registra o Service Worker para habilitar o PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registrado!', reg))
                    .catch(err => console.error('Erro no Service Worker', err));
            });
        }

        // Lógica de prompt de instalação contínua
        let deferredPrompt;
        const pwaPrompt = document.getElementById('pwa-prompt');
        const installBtn = document.getElementById('pwa-install');
        const closeBtn = document.getElementById('pwa-close');

        // Este evento dispara automaticamente caso o PWA não esteja instalado
        window.addEventListener('beforeinstallprompt', (e) => {
            // Previne o mini-infobar padrão do Chrome
            e.preventDefault();
            // Guarda o evento para acionar depois
            deferredPrompt = e;
            // Mostra nosso UI customizado
            pwaPrompt.style.display = 'block';
        });

        // Quando o usuário clica em "Instalar App"
        installBtn.addEventListener('click', async () => {
            pwaPrompt.style.display = 'none';
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('PWA Instalado com sucesso');
                }
                deferredPrompt = null;
            }
        });

        // Quando o usuário clica em "Agora não"
        closeBtn.addEventListener('click', () => {
            pwaPrompt.style.display = 'none';
            // Como não instalou, o evento beforeinstallprompt vai disparar de novo no próximo refresh.
        });
    </script>
</body>
</html>
